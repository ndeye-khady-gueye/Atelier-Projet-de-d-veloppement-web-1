# NRV.net - environnement complet (local et docketu)
# Lancer :  docker compose up -d --build
# Ports : plage 45000-45003 (à confirmer avec la répartition des ports docketu)

services:
  # API PHP / Slim (dossier back/)
  nrv.api:
    build:
      context: ./docker/php
    ports:
      - "45000:80"
    volumes:
      - ./back:/var/www/html
    environment:
      NRV_DEBUG: "${NRV_DEBUG:-1}" # 0 sur docketu (fichier .env)
      NRV_CORS_ORIGIN: "*"
    depends_on:
      - nrv.db
    restart: unless-stopped

  # Base PostgreSQL, initialisée avec les scripts du dossier sql/ au premier lancement
  nrv.db:
    image: postgres:16
    environment:
      POSTGRES_DB: nrv
      POSTGRES_USER: nrv
      POSTGRES_PASSWORD: "${NRV_DB_PASSWORD:-changeme}" # mot de passe réel dans .env sur docketu
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data-dev.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - nrv-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Interface d'administration de la base : http://localhost:45001
  # (système PostgreSQL, serveur nrv.db, utilisateur nrv, mot de passe changeme)
  adminer:
    image: adminer
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"] # IPv4 : docketu n'a pas d'IPv6
    ports:
      - "45001:8080"
    depends_on:
      - nrv.db
    restart: unless-stopped

  # Front statique (dossier front/) : http://localhost:45002
  nrv.front:
    image: nginx:alpine
    ports:
      - "45002:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  nrv-data:
