<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soirée – NRV.net</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="entete">
  <div class="conteneur entete__barre">
    <a class="entete__logo" href="index.html">NRV<span>.net</span></a>
    <nav aria-label="Navigation principale">
      <ul class="menu">
        <li><a href="index.html">Programme</a></li>
        <li><a href="panier.html">Panier</a></li>
        <li><a href="connexion.html">Connexion</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="conteneur">
  <!-- rempli par js/soiree.js (fetch /soirees/{id} + template tpl-soiree) -->
  <article class="soiree" id="soiree" aria-live="polite">
    <p class="message">Chargement de la soirée…</p>
  </article>
</main>
<footer class="pied"><p>Nancy Rock Vibration · NRV.net</p></footer>
<!-- Template Handlebars : la maquette de la soirée, avec des {{ }} à la place des données -->
<script id="tpl-soiree" type="text/x-handlebars-template">
    <header class="soiree__entete">
      <p class="soiree__theme">{{thematique}}</p>
      <h1>{{nom}}</h1>
      <p><time datetime="{{date}}T{{horaire}}">{{dateTexte}} · {{heureTexte}}</time><br>
         {{lieu.nom}}, {{lieu.adresse}}</p>
    </header>

    <section class="soiree__tarifs" aria-labelledby="titre-tarifs">
      <h2 id="titre-tarifs">Tarifs</h2>
      <dl class="tarifs">
        <div><dt>Normal</dt><dd>{{tarifs.normal}}</dd></div>
        <div><dt>Réduit</dt><dd>{{tarifs.reduit}}</dd></div>
        <div><dt>Pass 3 jours normal</dt><dd>{{tarifs.pass_normal}}</dd></div>
        <div><dt>Pass 3 jours réduit</dt><dd>{{tarifs.pass_reduit}}</dd></div>
      </dl>
      {{#if complet}}
      <p class="etiquette">Complet</p>
      {{else}}
      <p>Places restantes : <strong>{{places_restantes}}</strong></p>
      {{/if}}
      <p><a href="pass.html">Acheter un pass 3 jours</a></p>
    </section>

    <form class="achat" id="form-panier" action="#" method="post">
      <h2>Réserver</h2>
      <input type="hidden" name="soiree" value="{{id}}">
      <div class="champ">
        <label for="tarif">Tarif</label>
        <select id="tarif" name="categorie"{{#if complet}} disabled{{/if}}>
          <option value="normal">Normal – {{tarifs.normal}}</option>
          <option value="reduit">Réduit – {{tarifs.reduit}}</option>
        </select>
      </div>
      <div class="champ">
        <label for="quantite">Quantité</label>
        <input type="number" id="quantite" name="quantite" min="1" max="{{quantiteMax}}" value="1"{{#if complet}} disabled{{/if}}>
      </div>
      <p class="message message--erreur" id="erreur-ajout" role="alert" hidden></p>
      <p class="message" id="message-ajout" role="status">{{#if complet}}Cette soirée est complète.{{/if}}</p>
      <button class="bouton" type="submit"{{#if complet}} disabled{{/if}}>Ajouter au panier</button>
    </form>

    <section id="liste-spectacles-soiree" class="soiree__spectacles" aria-label="Spectacles de la soirée">
      {{#each spectacles}}
      <article class="spectacle">
        {{#if image}}
        <picture>
          <img src="{{image}}" alt="{{titre}} en concert" width="640" height="360" loading="lazy">
        </picture>
        {{/if}}
        <div class="spectacle__corps">
          <h3>{{titre}}</h3>
          <p><time datetime="{{../date}}T{{horaire}}">{{heureTexte}}</time></p>
          <p class="spectacle__artistes">{{artistesTexte}}</p>
          <p>{{description}}</p>
          <p class="etiquette">{{style}}</p>
          {{#if video}}
          <p><a class="bouton bouton--secondaire" href="{{video}}" target="_blank" rel="noopener">Voir la vidéo</a></p>
          {{/if}}
        </div>
      </article>
      {{/each}}
    </section>
</script>
<script src="js/vendor/handlebars.min.js"></script>
<script type="module" src="js/soiree.js"></script>
</body>
</html>
