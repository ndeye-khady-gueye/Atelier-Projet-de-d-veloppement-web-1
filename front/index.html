<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programme – NRV.net</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="entete">
  <div class="conteneur entete__barre">
    <a class="entete__logo" href="index.html">NRV<span>.net</span></a>
    <nav aria-label="Navigation principale">
      <ul class="menu">
        <li><a href="index.html" aria-current="page">Programme</a></li>
        <li><a href="panier.html">Panier</a></li>
        <li><a href="connexion.html">Connexion</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="conteneur">
  <h1>Programme du festival</h1>
  <p class="message message--succes" id="message-deconnexion" role="status" hidden></p>
  <nav class="vues" aria-label="Mode d'affichage">
    <a href="index.html" aria-current="page">Par spectacle</a>
    <a href="soirees.html">Par soirée</a>
  </nav>

  <form class="filtres" id="filtres" action="index.html" method="get">
    <div class="champ">
      <label for="filtre-date">Date</label>
      <input type="date" id="filtre-date" name="date">
    </div>
    <div class="champ">
      <label for="filtre-style">Style</label>
      <select id="filtre-style" name="style">
        <option value="">Tous les styles</option>
      </select>
    </div>
    <button class="bouton" type="submit">Filtrer</button>
  </form>

  <!-- rempli par js/programme.js (fetch /spectacles + template tpl-spectacles) -->
  <section id="liste-spectacles" class="liste-spectacles" aria-label="Liste des spectacles" aria-live="polite">
    <p class="message">Chargement du programme…</p>
  </section>

  <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
</main>
<footer class="pied"><p>Nancy Rock Vibration · NRV.net</p></footer>

<!-- Templates Handlebars (la carte d'exemple de la maquette, avec des {{ }} à la place des données) -->
<script id="tpl-spectacles" type="text/x-handlebars-template">
  {{#each spectacles}}
  <article class="carte-spectacle">
    <a class="carte-spectacle__lien" href="soiree.html?id={{soireeId}}">
      <picture>
        <img src="{{image}}" alt="{{titre}} en concert" width="640" height="360" loading="lazy">
      </picture>
      <div class="carte-spectacle__corps">
        <h2 class="carte-spectacle__titre">{{titre}}</h2>
        <p class="carte-spectacle__date"><time datetime="{{date}}T{{horaire}}">{{dateTexte}} · {{heureTexte}}</time></p>
        <p class="etiquette">{{style}}</p>
      </div>
    </a>
  </article>
  {{else}}
  <p class="message">Aucun spectacle ne correspond à ces critères.</p>
  {{/each}}
</script>

<script id="tpl-pagination" type="text/x-handlebars-template">
  {{#if precedent}}<a class="bouton bouton--secondaire" href="{{precedent}}">Précédent</a>
  {{else}}<a class="bouton bouton--secondaire" aria-disabled="true">Précédent</a>{{/if}}
  <span>Page {{page}} / {{pages}}</span>
  {{#if suivant}}<a class="bouton bouton--secondaire" href="{{suivant}}">Suivant</a>
  {{else}}<a class="bouton bouton--secondaire" aria-disabled="true">Suivant</a>{{/if}}
</script>

<script id="tpl-styles" type="text/x-handlebars-template">
  <option value="">Tous les styles</option>
  {{#each styles}}<option value="{{id}}"{{#if choisi}} selected{{/if}}>{{libelle}}</option>{{/each}}
</script>

<script src="js/vendor/handlebars.min.js"></script>
<script type="module" src="js/programme.js"></script>
</body>
</html>
