<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – NRV.net</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="entete">
  <div class="conteneur entete__barre">
    <a class="entete__logo" href="index.html">NRV<span>.net</span></a>
    <nav aria-label="Navigation principale">
      <ul class="menu">
        <li><a href="index.html">Programme</a></li>
        <li><a href="panier.html">Panier</a></li>
        <li><a href="connexion.html" aria-current="page">Connexion</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="conteneur">
  <h1>Connexion</h1>
  <div class="deux-colonnes">
    <form class="formulaire" id="form-connexion" action="#" method="post">
      <h2>Déjà inscrit ?</h2>
      <div class="champ">
        <label for="connexion-email">Email</label>
        <input type="email" id="connexion-email" name="email" autocomplete="email" required>
      </div>
      <div class="champ">
        <label for="connexion-mdp">Mot de passe</label>
        <input type="password" id="connexion-mdp" name="password" autocomplete="current-password" required>
      </div>
      <p class="message message--erreur" id="erreur-connexion" role="alert" hidden></p>
      <button class="bouton" type="submit">Se connecter</button>
    </form>
    <form class="formulaire" id="form-inscription" action="#" method="post">
      <h2>Créer un compte</h2>
      <div class="champ">
        <label for="inscription-nom">Nom</label>
        <input type="text" id="inscription-nom" name="nom" autocomplete="name" required>
      </div>
      <div class="champ">
        <label for="inscription-email">Email</label>
        <input type="email" id="inscription-email" name="email" autocomplete="email" required>
      </div>
      <div class="champ">
        <label for="inscription-mdp">Mot de passe</label>
        <input type="password" id="inscription-mdp" name="password" autocomplete="new-password" minlength="8" required>
      </div>
      <p class="message message--erreur" id="erreur-inscription" role="alert" hidden></p>
      <button class="bouton" type="submit">Créer mon compte</button>
    </form>
  </div>
</main>
<footer class="pied"><p>Nancy Rock Vibration · NRV.net</p></footer>
<script type="module" src="js/connexion.js"></script>
</body>
</html>
